    <style>
@font-face {

}

}

  display: block;

}

      <canvas id="screen" width="426" height="240" tabindex="0" aria-label="下一班火车"></canvas>

    <script>
/** 《下一班火车》— seeded hand, hierarchical sign-offs, trains that come back. */

const CHANGES = [
  {
    id: "color",
    title: "按钮改成品牌蓝",
    diff: "- color: #8c8c8c;\n+ color: #1677ff;",
    blurb: "签字更多，会惊动影子架构师，审计风险从 1 开始。",
    extraNodes: 2,
    bosses: ["architect"],
    audit: 1,
  },
  {
    id: "typo",
    title: "文案少一个错别字",
    diff: "- 立即够买\n+ 立即购买",
    blurb: "只动一个字。起步只有基础审批，没有老板级门禁。",
    extraNodes: 0,
    bosses: [],
    audit: 0,
  },
  {
    id: "period",
    title: "注释补一个句号",
    diff: "- // TODO 下个版本再说\n+ // TODO 下个版本再说。",
    blurb: "注释没有主人。薛定谔的负责人藏在两三个名字里。",
    extraNodes: 1,
    bosses: ["schrodinger"],
    audit: 0,
  },
];

const CARDS = [
  { id: "talk", name: "去问问", detail: "多一个签字。能问出隐藏要求，或收回一点人情。", energy: 1, favor: 0, sanity: 0 },
  { id: "align", name: "拉通对齐", detail: "指出真负责人，或把两个节点并成一个。会再抄送一个人。", energy: 1, favor: 1, sanity: 1 },
  { id: "cc", name: "向上管理", detail: "老板点头，通过一个节点。跨团队抄送掉理智。", energy: 1, favor: 1, sanity: 2 },
  { id: "reframe", name: "偷换概念", detail: "标题改成体验优化。合规对峙时，特批才不被按住。", energy: 1, favor: 0, sanity: 0 },
  { id: "hotfix", name: "Hotfix特批", detail: "跳过普通签字。审计那格盖不过。成功会抬高审计风险。", energy: 2, favor: 1, sanity: 0 },
  { id: "weekend", name: "周末突击", detail: "亲手通过一个节点。打在卡夫卡身上，这回合不再增生表格。", energy: 2, favor: 0, sanity: 0 },
  { id: "rest", name: "休息", detail: "补精力和理智。不签字，表格仍可能自己长。", energy: 0, favor: 0, sanity: 0 },
];

const DECK = ["talk", "talk", "align", "align", "cc", "cc", "reframe", "weekend", "weekend", "weekend", "hotfix", "rest", "rest"];
const RECOVERY = { energy: 4, sanity: 1, favor: 1 };
const REST_ENERGY = 4;
const REST_SANITY = 1;
const HAND_SIZE = 4;
const AUDIT_THRESHOLD = 2;
const MAX_FORMS = 1;

const APPROVERS = [
  { name: "文案负责人", lines: ["这个用词谁拍板？我只是先看看。", "原则上可以，但请再对一下品牌语气。", "我签可以，别在发布说明里写我的名字。"] },
  { name: "设计", lines: ["颜色不在这期规范里。", "我没意见，让设计系统的人看一眼。", "这颗按钮下个版本可能换掉，你确定现在改？"] },
  { name: "测试", lines: ["回归范围发我。一行也要测。", "我可以过，但今晚的包已经冻结了。", "用例我补上了，你别再改文案。"] },
  { name: "客户端", lines: ["热修通道今晚有人值守吗？", "这行我可以合，别顺手改别的。", "包体积没变，我没理由拦。"] },
  { name: "产品", lines: ["需求单里没有这一句。", "用户不会因为一个字留下来。", "你要上就上，别说是我催的。"] },
  { name: "数据", lines: ["埋点不用改的话，我签字。", "改颜色算不算一次实验？", "报表口径别动就行。"] },
  { name: "运营", lines: ["活动页还指着旧颜色。", "文案我们群里对过了，应该是这版。", "大促素材已经发出去了，你悠着点。"] },
];

const BOSS_LINES = {
  kafka: [
    "补充材料。这份和上一份不矛盾，但都要交。",
    "原则上我不反对。请把流程编号填在第三栏。",
    "材料收了。还差一页，页码你自己编。",
  ],
  schrodinger: [
    "他人不在办公区。这个风险谁来背？原则上我不反对，但建议拉下合规。",
    "真负责人可能是这几位里的一个。我只是代收消息。",
    "你找到人之前，这格会一直亮着。",
  ],
  architect: [
    "技术洁癖。一行改动请先抽象成主题变量，这周评审不过。",
    "这张牌的效果我按回去。就这一次，下不为例。",
    "主题系统以后再说。今天我只否这一手。",
  ],
  vp: [
    "VP 的会只有十五分钟。你要讲风险，还是讲这一行？",
    "助理问：这个风险谁来背？",
    "会议纪要明天才出。车不等纪要。",
  ],
  audit: [
    "特批次数到了。这一笔审计单独过，特批盖不过。",
    "审计只看特批记录。你越跳，这格越硬。",
  ],
};

const LEVELS = {
  1: { name: "修错别字", days: 6, energy: 14, sanity: 10, favor: 5, baseNodes: 1, bosses: [], audit: 0, businessCut: false },
  2: { name: "版本大联调", days: 6, energy: 12, sanity: 10, favor: 5, baseNodes: 2, bosses: ["architect"], audit: 0, businessCut: false },
  3: { name: "红线行动", days: 6, energy: 14, sanity: 10, favor: 5, baseNodes: 2, bosses: ["kafka", "schrodinger"], audit: 1, businessCut: false },
  4: { name: "封网期大促", days: 6, energy: 14, sanity: 10, favor: 5, baseNodes: 2, bosses: ["kafka", "vp"], audit: 1, businessCut: true },
};

const OUTCOMES = {
  absurd: {
    kind: "ending",
    title: "荒诞胜利",
    text: "一行改动合并了。业务其实早就把这个按钮砍了。它当天上线，当天被下掉。",
  },
  corrupt: {
    kind: "ending",
    title: "黑化结局",
    text: "理智见底。你坐上流程负责人的位子，给下一班又加了一道审批。",
  },
  nihil: {
    kind: "ending",
    title: "虚无结局",
    text: "一连几个月，没有东西上车。合规报告打了 100 分。竞品已经上线了同样的按钮。",
  },
  quit: {
    kind: "failure",
    title: "精力耗尽",
    text: "你提了离职。这一行还停在草稿里。",
  },
  miss: {
    kind: "failure",
    title: "没有下一班了",
    text: "这几班都准点开走了。审批一次次清零，窗口用完了。",
  },
  deadlock: {
    kind: "failure",
    title: "合规死锁",
    text: "安全要明细行为日志，合规禁止记录任何行为。两份要求对冲，谁也签不了字。合并请求被打回，审批全部清零。",
  },
};

function getChange(id) {
  return CHANGES.find((item) => item.id === id) || CHANGES[0];
}

function getLevel(id) {
  return LEVELS[id] || null;
}

function stageLabel(state) {
  if (state.nodes.some((node) => node.boss === "vp")) return "VP 会议";
  if (state.nodes.some((node) => node.boss === "kafka" || node.boss === "schrodinger")) return "跨团队";
  if (state.nodes.filter((node) => !node.fake && !node.form).length >= 3) return "3 位审批";
  return "起步";
}

function createRun(levelId, changeId, seed = 1) {
  const level = getLevel(levelId);
  const change = getChange(changeId);
  if (!level) throw new Error(`Unknown level ${levelId}`);
  const state = blank(levelId, level, change, seed >>> 0 || 1);
  push(state, "列车", introLine(level, change));
  deal(state, level, change, null);
  if (state.businessCut) {
    say(state, "产品", ["这个按钮业务已经砍了。你要是还塞上去，当天就会被撤下来。", "封网期还改这个？上了也会被撤。"]);
  }
  openVp(state);
  ensureHand(state);
  return state;
}

function continueLevel(prev) {
  const next = createRun(prev.outcome.id, prev.changeId, (prev.seed + prev.levelId * 17) >>> 0);
  next.energy = Math.min(next.energyMax, prev.energy + RECOVERY.energy);
  next.sanity = Math.min(next.sanityMax, Math.max(1, prev.sanity + RECOVERY.sanity));
  next.favor = Math.min(next.favorMax, prev.favor + RECOVERY.favor);
  next.audit = prev.audit;
  next.ledger = prev.ledger.map((row) => ({ ...row }));
  if (next.audit >= AUDIT_THRESHOLD) ensureAudit(next);
  const back = `上一关带回精力 ${prev.energy}，休息后是 ${next.energy}。理智 ${next.sanity}，人情 ${next.favor}。`;
  push(next, "列车", back);
  next.turns = [{ source: "过关恢复", text: `精力 ${signed(next.energy - prev.energy)} · 理智 ${signed(next.sanity - prev.sanity)} · 人情 ${signed(next.favor - prev.favor)}` }];
  if (next.energy <= 0) {
    next.outcome = { kind: "failure", id: "quit" };
    return next;
  }
  if (next.sanity <= 0) {
    next.sanity = 0;
    next.pendingChoice = "corrupt";
    return next;
  }
  ensureHand(next);
  return next;
}

function conflictOpen(state) {
  const kafka = state.nodes.some((node) => node.boss === "kafka" && node.status !== "approved");
  const security = state.nodes.some((node) => node.boss === "schrodinger" && node.status !== "approved");
  return kafka && security;
}

function blockReason(state, actionId) {
  if (!state || state.outcome) return "这局已经结束";
  if (state.pendingChoice) return "先做眼前的选择";
  const card = CARDS.find((item) => item.id === actionId);
  if (!card) return "没有这张牌";
  if (!state.hand.includes(actionId)) return "不在手牌里";
  if (state.days <= 0) return "没有天数了";
  if (state.energy < card.energy) return "精力不足";
  if (state.favor < card.favor) return "人情不足";
  if (actionId === "hotfix" && state.nodes.some((node) => node.boss === "audit" && node.status !== "approved")) return "审计节点不吃特批";
  if (actionId === "hotfix" && conflictOpen(state) && !state.conceptSwap) return "对峙未解开，特批无效";
  if (actionId === "reframe" && state.conceptSwap) return "标题已经改过";
  if (actionId === "align") {
    const canReveal = !state.schrodingerRevealed && state.nodes.some((node) => node.real);
    const pending = state.nodes.filter((node) => blocking(state, node));
    if (!canReveal && pending.length < 2) return "没有可合并的节点";
  }
  if (actionId === "cc" && !firstBlocking(state, (node) => node.boss !== "audit")) return "没有能点头的节点";
  if (actionId === "weekend" && !firstBlocking(state)) return "没有可补的节点";
  return "";
}

function canPlay(state, actionId) {
  return blockReason(state, actionId) === "";
}

function legalActions(state) {
  if (!state || state.outcome) return [];
  if (state.pendingChoice === "corrupt") return ["corrupt", "decline"];
  if (state.pendingChoice === "vp") return ["vp-attend", "vp-delegate", "vp-skip"];
  const actions = CARDS.map((card) => card.id).filter((id) => canPlay(state, id));
  if (conflictOpen(state)) actions.push("nihil", "force");
  return actions;
}

function applyAction(prev, actionId) {
  if (!prev || prev.outcome) return prev;
  const before = takeStats(prev);
  const next = dispatch(prev, actionId);
  if (next !== prev) stamp(next, before, actionId);
  return next;
}

function dispatch(prev, actionId) {
  if (actionId === "nihil") return chooseNihil(prev);
  if (actionId === "force") return chooseForce(prev);
  if (actionId === "corrupt") return chooseCorrupt(prev);
  if (actionId === "decline") return chooseDecline(prev);
  if (actionId === "vp-attend" || actionId === "vp-delegate" || actionId === "vp-skip") return chooseVp(prev, actionId);
  if (!canPlay(prev, actionId)) return prev;
  const state = structuredClone(prev);
  state.addressedKafka = false;
  if (actionId === "hotfix") return playHotfix(state);
  if (actionId === "rest") return playRest(state);
  const card = CARDS.find((item) => item.id === actionId);
  pay(state, card);
  const snap = snapshot(state);
  if (actionId === "talk") talk(state);
  else if (actionId === "align") align(state);
  else if (actionId === "cc") cc(state);
  else if (actionId === "reframe") reframe(state);
  else if (actionId === "weekend") weekend(state);
  if (architectReverse(state, snap)) {
    discard(state, actionId);
    return closeTurn(state, false);
  }
  discard(state, actionId);
  return closeTurn(state, true);
}

function chooseNihil(prev) {
  if (!conflictOpen(prev)) return prev;
  const state = structuredClone(prev);
  say(state, "你", ["那先出一份合规报告吧。需求先别上。", "两边的话我都写进报告。车先别等。"]);
  say(state, "合规", ["报告很完整。分数是 100。", "流程分满分。产品分没有这项。"]);
  state.outcome = { kind: "ending", id: "nihil" };
  return state;
}

function chooseForce(prev) {
  if (!conflictOpen(prev)) return prev;
  const state = structuredClone(prev);
  say(state, "你", ["这个风险我来背，强行合入。", "日志打满，同时承诺不采集。我两个都写上。"]);
  say(state, "合规", ["安全要日志，隐私不让记。这个字我签不了。", "两份要求对冲。合并请求退回，名单清空。"]);
  state.outcome = { kind: "failure", id: "deadlock" };
  return state;
}

function chooseCorrupt(prev) {
  if (prev.pendingChoice !== "corrupt") return prev;
  const state = structuredClone(prev);
  state.pendingChoice = null;
  say(state, "你", ["那我来做流程负责人。下一班，加一道卡点。", "行。门禁我来守。这一行先别上了。"]);
  state.outcome = { kind: "ending", id: "corrupt" };
  return state;
}

function chooseDecline(prev) {
  if (prev.pendingChoice !== "corrupt") return prev;
  const state = structuredClone(prev);
  state.pendingChoice = null;
  state.sanity = Math.max(state.sanity, 5);
  say(state, "你", ["流程负责人我不当。我还是要把这一行送上车。"]);
  say(state, "大老板", ["那你自己跟。位子先空着，理智给你留一点。", "不当也行。别在群里消失。"]);
  return finish(state);
}

function chooseVp(prev, actionId) {
  if (prev.pendingChoice !== "vp") return prev;
  const state = structuredClone(prev);
  state.pendingChoice = null;
  state.vpResolved = true;
  state.addressedKafka = false;
  if (actionId === "vp-attend") {
    state.sanity -= 1;
    state.days -= 1;
    const vp = state.nodes.find((node) => node.boss === "vp");
    if (vp) vp.status = "approved";
    const other = firstBlocking(state, (node) => node.boss !== "vp" && node.boss !== "audit");
    if (other) {
      other.status = "approved";
      say(state, "VP", [`会开完了。${other.name}这关算过。你的理智不在纪要里。`, "十五分钟讲完一行。VP 点了头，助理记下了风险。"]);
    } else {
      say(state, "VP", ["人到齐了。这页没有可放行的名字，会还是开了。"]);
    }
    return closeTurn(state, true);
  }
  if (actionId === "vp-delegate") {
    state.sanity -= 1;
    say(state, "助理", ["助理代开了。原则上没问题，建议再拉通一下。纪要没有决议。", "你没进会议室。助理说：这个风险谁来背？"]);
    return finish(state);
  }
  say(state, "你", ["这个会你没去。纪要里没有你的名字，节点也还在。"]);
  return finish(state);
}

function playRest(state) {
  state.days -= 1;
  const snap = snapshot(state);
  state.energy = Math.min(state.energyMax, state.energy + REST_ENERGY);
  state.sanity = Math.min(state.sanityMax, state.sanity + REST_SANITY);
  say(state, "你", ["你合上电脑，去茶水间站了十分钟。", "休息补回一点精力。审批树没动，表还可能自己长。"]);
  if (architectReverse(state, snap)) {
    discard(state, "rest");
    return closeTurn(state, false);
  }
  discard(state, "rest");
  return closeTurn(state, true);
}

function playHotfix(state) {
  const blocked = (conflictOpen(state) && !state.conceptSwap) || state.nodes.some((node) => node.boss === "audit");
  if (blocked) {
    state.energy -= 1;
    say(state, "合规", [
      "特批被按住。失败这一下只扣了一点精力，人情和天数都没动。",
      "审计那格特批盖不过。卡还在你手里。",
      "安全要日志，合规不让记。特批先放回去。",
    ]);
    return finish(state);
  }
  state.energy -= 2;
  state.favor -= 1;
  state.days -= 1;
  const snap = snapshot(state);
  for (const node of state.nodes) {
    if (node.boss || node.form || node.real || node.fake) continue;
    node.status = "approved";
  }
  state.audit += 1;
  say(state, "发布值班", ["Hotfix 特批通过了普通签字。审计风险往上走了一格。", "一行被推进列车。审计台在旁边记了一笔。"]);
  if (architectReverse(state, snap)) {
    discard(state, "hotfix");
    return closeTurn(state, false);
  }
  ensureAudit(state);
  discard(state, "hotfix");
  return closeTurn(state, true);
}

function talk(state) {
  const hidden = state.nodes.find((node) => node.hidden && !node.revealed);
  if (hidden) {
    hidden.revealed = true;
    hidden.hidden = false;
    say(state, hidden.name, [hidden.line, `${hidden.name}终于把隐藏要求说出来了：${hidden.line}`]);
  } else if (!state.schrodingerRevealed && state.nodes.some((node) => node.real)) {
    revealSchrodinger(state, "问");
  } else {
    state.favor += 1;
    say(state, "同事", ["问完，有人私下说可以帮你递一下。人情 +1。", "对方没签字，但把你拉进了那个小群。人情 +1。"]);
  }
  const parent = firstBlocking(state);
  const extra = addApprover(state, parent ? parent.id : null);
  say(state, "系统", [`去问的代价是多了一位：${extra.name}。`, `${extra.name}被加进审批树。原来的人还没签。`]);
}

function align(state) {
  if (!state.schrodingerRevealed && state.nodes.some((node) => node.real)) {
    revealSchrodinger(state, "对齐");
    const real = state.nodes.find((node) => node.real);
    const boss = state.nodes.find((node) => node.boss === "schrodinger");
    if (real) real.status = "approved";
    if (boss) boss.status = "approved";
  } else {
    const pending = state.nodes.filter((node) => blocking(state, node));
    if (pending.length >= 2) {
      pending[1].status = "approved";
      say(state, "纪要", [
        `${pending[0].name}和${pending[1].name}并成一个会签。后者这关不用再单独签。`,
        `拉通之后，${pending[1].name}的格子并进去了。`,
      ]);
    } else {
      say(state, "纪要", ["纪要写了「原则上不反对」。人还在，但你看清了卡在谁身上。", "对齐没有可合并的两格，不过责任人写明白了。"]);
    }
  }
  const extra = addApprover(state, null);
  extra.status = "read";
  say(state, "系统", [`抄送了${extra.name}。这格不用再签，只是多一个人看见。`, `${extra.name}回了已读。人在树上，但不挡这班车。`]);
}

function cc(state) {
  state.ccCount += 1;
  const node = firstBlocking(state, (item) => item.boss !== "audit");
  if (node) {
    node.status = "approved";
    if (node.boss === "kafka" || node.form) state.addressedKafka = true;
    say(state, "大老板", [`已读。${node.name}先点头。抄送列表又长了一截。`, `老板回了个「看过」。${node.name}这关过了，你的理智没过。`]);
  } else {
    say(state, "大老板", ["已读。能点头的格子不多了，邮件还是发出去了。"]);
  }
}

function reframe(state) {
  state.conceptSwap = true;
  state.title = "体验优化（非功能变更）";
  say(state, "你", ["标题改模糊了。diff 还是原来那一行。", "你把它叫成体验优化。审核的人要翻到代码才知道是改色。"]);
}

function weekend(state) {
  const node = firstBlocking(state);
  if (!node) {
    say(state, "你", ["周六夜里办公室只有你。已经没有卡点可补了。"]);
    return;
  }
  node.status = "approved";
  if (node.boss === "kafka" || node.form) state.addressedKafka = true;
  say(state, "你", [
    `周末午夜你把材料补上了。${node.name}变成已通过。`,
    `灯只开了一排。${node.name}的格子你自己填完了。`,
  ]);
}

function architectReverse(state, snap) {
  const architect = snap.nodes.find((node) => node.boss === "architect" && node.status !== "approved");
  if (!architect || state.architectUsed) return false;
  state.nodes = snap.nodes;
  state.conceptSwap = snap.conceptSwap;
  state.audit = snap.audit;
  state.title = snap.title;
  state.schrodingerRevealed = snap.schrodingerRevealed;
  state.favor = snap.favor;
  state.architectUsed = true;
  const restored = state.nodes.find((node) => node.boss === "architect");
  if (restored) restored.status = "approved";
  push(state, "影子架构师", "影子架构师：把上一张牌的效果按了回去。");
  return true;
}

function closeTurn(state, kafka) {
  if (kafka) spawnKafkaForm(state);
  ensureAudit(state);
  return finish(state);
}

function finish(state) {
  if (state.outcome) return state;
  if (cleared(state)) {
    state.outcome = state.businessCut || state.levelId >= 4
      ? { kind: "ending", id: "absurd" }
      : { kind: "level", id: state.levelId + 1 };
    return state;
  }
  if (state.energy <= 0) {
    state.outcome = { kind: "failure", id: "quit" };
    return state;
  }
  if (state.sanity <= 0) {
    state.sanity = 0;
    state.pendingChoice = "corrupt";
    say(state, "大老板", ["理智见底了。那你来做流程负责人吧。", "你看起来会喜欢门禁。下一班的卡点，要不要你来加？"]);
    return state;
  }
  if (state.days <= 0) return missTrain(state);
  ensureHand(state);
  if (!legalActions(state).length) ensureHand(state);
  return state;
}

function missTrain(state) {
  state.train += 1;
  if (state.train > state.maxTrains) {
    say(state, "列车", ["这班也准点开走了。窗口用完，没有下一班。", "审批清零过好几次。发车时刻表翻到头了。"]);
    state.outcome = { kind: "failure", id: "miss" };
    return state;
  }
  const kept = state.nodes.find((node) => node.status === "approved" && node.boss !== "audit" && !node.fake && !node.form);
  const level = getLevel(state.levelId);
  const change = getChange(state.changeId);
  state.days = state.dayBudget;
  state.bossDone = state.bossDone || {};
  for (const node of state.nodes) {
    if (node.boss && node.status === "approved") state.bossDone[node.boss] = true;
  }
  state.vpResolved = !!state.bossDone.vp;
  state.pendingChoice = null;
  say(state, "列车", [
    `这班准点开走了，没有你这一行。审批清零，下一班是第 ${state.train} 班。精力和理智还在。`,
    `错过了。签字作废，只留一个已经通过的名字当进度。第 ${state.train} / ${state.maxTrains} 班。`,
  ]);
  deal(state, level, change, kept || null);
  openVp(state);
  ensureHand(state);
  return state;
}

function spawnKafkaForm(state) {
  const kafka = state.nodes.find((node) => node.boss === "kafka" && node.status !== "approved");
  if (!kafka || state.addressedKafka) return;
  const forms = state.nodes.filter((node) => node.form).length;
  if (forms >= MAX_FORMS) return;
  const form = addNode(state, {
    name: `补充材料 ${forms + 1}`,
    status: "blocked",
    boss: "",
    form: forms + 1,
    line: "又一份表。原则上我不反对，但这份也得填。",
  }, kafka.id);
  state.sanity -= 1;
  push(state, "流程卡夫卡", "流程卡夫卡：又长出一张表，+1 节点。");
}

function ensureAudit(state) {
  if (state.audit < AUDIT_THRESHOLD) return;
  if (state.nodes.some((node) => node.boss === "audit")) return;
  addNode(state, {
    name: "审计",
    status: "blocked",
    boss: "audit",
    line: BOSS_LINES.audit[0],
  }, null);
  push(state, "审计", "审计：风险到了，多了一格。特批盖不过。");
}

function revealSchrodinger(state, via) {
  state.schrodingerRevealed = true;
  const real = state.nodes.find((node) => node.real);
  for (const node of state.nodes) {
    if (node.fake) node.status = "read";
  }
  if (real) {
    say(state, "薛定谔的负责人·安全专家", [
      `${via}完才看清：真负责人是${real.name}。其余两位只是被写进群里。`,
      `真人是${real.name}。另外几个名字不用签了。`,
    ]);
  }
}

function pay(state, card) {
  state.energy -= card.energy;
  state.favor -= card.favor;
  state.sanity -= card.sanity;
  state.days -= 1;
}

function blank(levelId, level, change, seed) {
  return {
    seed,
    rngS: seed >>> 0,
    levelId: Number(levelId),
    levelName: level.name,
    changeId: change.id,
    title: change.title,
    diff: change.diff,
    energy: level.energy,
    sanity: level.sanity,
    favor: level.favor,
    days: level.days,
    dayBudget: level.days,
    train: 1,
    maxTrains: 3,
    audit: level.audit + change.audit,
    energyMax: 16,
    sanityMax: 12,
    favorMax: 8,
    auditMax: 3,
    nodes: [],
    ledger: [],
    turns: [],
    nextId: 1,
    log: [],
    hand: [],
    deck: [],
    discard: [],
    lastLine: {},
    ccCount: 0,
    conceptSwap: false,
    businessCut: !!level.businessCut,
    architectUsed: false,
    bossDone: {},
    schrodingerRevealed: false,
    vpResolved: false,
    addressedKafka: false,
    pendingChoice: null,
    outcome: null,
  };
}

function deal(state, level, change, keep) {
  state.nodes = [];
  state.nextId = 1;
  state.deck = DECK.slice();
  state.discard = [];
  state.hand = [];
  shuffle(state, state.deck);
  if (keep) {
    addNode(state, {
      name: keep.name,
      status: "approved",
      boss: keep.boss && keep.boss !== "kafka" && keep.boss !== "vp" ? keep.boss : "",
      line: "上一班通过的名字，这班还算数。",
    }, null);
  }
  const pool = APPROVERS.slice();
  shuffle(state, pool);
  const count = level.baseNodes + change.extraNodes;
  for (let i = 0; i < count; i += 1) {
    const person = pool[i % pool.length];
    const line = person.lines[randInt(state, person.lines.length)];
    const node = addNode(state, {
      name: person.name,
      status: "pending",
      line,
      hidden: i === 1,
    }, null);
    if (!node.hidden) say(state, node.name, [line]);
    else say(state, "系统", [`${node.name}在名单上，具体要求先没说。`, `${node.name}接了单，隐藏条件和签字一起压着。`]);
  }
  const bosses = [];
  for (const boss of [...level.bosses, ...change.bosses]) {
    if (!bosses.includes(boss)) bosses.push(boss);
  }
  for (const boss of bosses) addBoss(state, boss);
  ensureAudit(state);
  drawTo(state, HAND_SIZE);
}

function addBoss(state, boss) {
  if (boss === "schrodinger") {
    const done = !!state.bossDone?.schrodinger;
    const node = addNode(state, {
      name: "薛定谔的负责人·安全专家",
      status: done ? "approved" : "blocked",
      boss: "schrodinger",
      line: BOSS_LINES.schrodinger[0],
    }, null);
    if (done) state.schrodingerRevealed = true;
    say(state, node.name, BOSS_LINES.schrodinger);
    const names = ["值班同学", "接口人", "前负责人"];
    const count = 2 + randInt(state, 2);
    const realAt = randInt(state, count);
    for (let i = 0; i < count; i += 1) {
      addNode(state, {
        name: names[i],
        status: done || i !== realAt ? "read" : "pending",
        fake: i !== realAt,
        real: i === realAt,
        line: i === realAt ? "日志要打全。这个风险可以写我的名字。" : "我只是在群里，签不了安全。",
      }, node.id);
    }
    return;
  }
  const table = {
    kafka: "流程卡夫卡·合规总监",
    architect: "影子架构师",
    vp: "VP 评审会",
  };
  const node = addNode(state, {
    name: table[boss],
    status: state.bossDone?.[boss] ? "approved" : "blocked",
    boss,
    line: BOSS_LINES[boss][0],
  }, null);
  if (boss === "architect" && state.bossDone?.architect) state.architectUsed = true;
  say(state, node.name, BOSS_LINES[boss]);
}

function addApprover(state, parentId) {
  const person = APPROVERS[randInt(state, APPROVERS.length)];
  const line = person.lines[randInt(state, person.lines.length)];
  return addNode(state, { name: person.name, status: "pending", line }, parentId);
}

function addNode(state, spec, parentId) {
  const node = {
    id: state.nextId,
    parentId: parentId ?? null,
    name: spec.name,
    status: spec.status || "pending",
    boss: spec.boss || "",
    line: spec.line || "",
    hidden: !!spec.hidden,
    revealed: false,
    fake: !!spec.fake,
    real: !!spec.real,
    form: spec.form || 0,
  };
  state.nextId += 1;
  state.nodes.push(node);
  return node;
}

function openVp(state) {
  if (state.vpResolved) return;
  if (state.nodes.some((node) => node.boss === "vp")) state.pendingChoice = "vp";
}

function introLine(level, change) {
  if (level.name === "修错别字") return `「${change.title}」进了第 1 关。车会一班一班开，错过还能等下一班。`;
  if (level.name === "版本大联调") return "上一行上车了。这班是大联调，影子架构师会否掉你打出的第一张牌。";
  if (level.name === "红线行动") return "红线开了。合规表格会自己长，安全负责人的真身还藏着。特批盖不过审计。";
  return "封网了。时间更短。业务已经把这个按钮砍了，真合进去也会当天被撤。";
}

function cleared(state) {
  return state.nodes.length > 0 && state.nodes.every((node) => !blocking(state, node));
}

function blocking(state, node) {
  if (node.status === "approved" || node.status === "read") return false;
  if (node.fake) return false;
  if ((node.boss === "schrodinger" || node.real) && !state.schrodingerRevealed) return false;
  return true;
}

function firstBlocking(state, pred = () => true) {
  const list = state.nodes.filter((node) => blocking(state, node) && pred(node));
  const rank = (node) => {
    if (node.form) return 0;
    if (node.boss === "kafka") return 1;
    if (node.boss === "audit") return 2;
    if (node.real) return 3;
    return 4;
  };
  list.sort((a, b) => rank(a) - rank(b) || a.id - b.id);
  return list[0];
}

function snapshot(state) {
  return {
    nodes: structuredClone(state.nodes),
    conceptSwap: state.conceptSwap,
    audit: state.audit,
    title: state.title,
    schrodingerRevealed: state.schrodingerRevealed,
    favor: state.favor,
  };
}

function discard(state, actionId) {
  const index = state.hand.indexOf(actionId);
  if (index >= 0) state.hand.splice(index, 1);
  state.discard.push(actionId);
  drawTo(state, HAND_SIZE);
}

function ensureHand(state) {
  if (state.outcome || state.pendingChoice) return;
  drawTo(state, HAND_SIZE);
  if (state.days <= 0 || state.energy <= 0) return;
  if (CARDS.some((card) => canPlay(state, card.id))) return;
  if (state.energy >= 1 && !state.hand.includes("talk")) state.hand.push("talk");
}

function drawTo(state, count) {
  while (state.hand.length < count) {
    if (!state.deck.length) {
      if (!state.discard.length) break;
      state.deck = state.discard;
      state.discard = [];
      shuffle(state, state.deck);
    }
    if (!state.deck.length) break;
    state.hand.push(state.deck.pop());
  }
}

function shuffle(state, list) {
  for (let i = list.length - 1; i > 0; i -= 1) {
    const j = randInt(state, i + 1);
    const swap = list[i];
    list[i] = list[j];
    list[j] = swap;
  }
}

function say(state, who, lines) {
  const pool = lines.filter((line) => line !== state.lastLine[who]);
  const text = pool[randInt(state, pool.length)] || lines[0];
  state.lastLine[who] = text;
  push(state, who, text);
}

function push(state, who, text) {
  state.log.push({ who, text });
  if (state.log.length > 80) state.log.splice(0, state.log.length - 80);
}

function signed(value) {
  return `${value >= 0 ? "+" : ""}${value}`;
}

function takeStats(state) {
  return {
    energy: state.energy,
    sanity: state.sanity,
    favor: state.favor,
    days: state.days,
    audit: state.audit,
    nodes: state.nodes.length,
    train: state.train,
  };
}

const ACTION_LABEL = {
  talk: "去问问",
  align: "拉通对齐",
  cc: "向上管理",
  reframe: "偷换概念",
  hotfix: "Hotfix特批",
  weekend: "周末突击",
  rest: "休息",
  "vp-attend": "跨团队会议",
  "vp-delegate": "跨团队会议",
  "vp-skip": "不去开会",
  nihil: "合规报告",
  force: "强行合入",
  corrupt: "黑化",
  decline: "拒绝黑化",
};

function stamp(state, before, actionId) {
  const parts = [];
  const dEnergy = state.energy - before.energy;
  const dSanity = state.sanity - before.sanity;
  const dFavor = state.favor - before.favor;
  const dDays = state.days - before.days;
  const dAudit = state.audit - before.audit;
  const dNodes = state.nodes.length - before.nodes;
  if (dEnergy) parts.push(`精力 ${signed(dEnergy)}`);
  if (dSanity) parts.push(`理智 ${signed(dSanity)}`);
  if (dFavor) parts.push(`人情 ${signed(dFavor)}`);
  if (dDays) parts.push(`天数 ${signed(dDays)}`);
  if (dAudit) parts.push(`审计 ${signed(dAudit)}`);
  if (dNodes) parts.push(`${dNodes > 0 ? "+" : ""}${dNodes} 节点`);
  if (state.train !== before.train) parts.push(`第 ${state.train} 班`);
  const source = ACTION_LABEL[actionId] || actionId;
  state.turns.push({ source, text: parts.join(" · ") || "没有数值变化" });
  if (state.turns.length > 6) state.turns.splice(0, state.turns.length - 6);
  if (dEnergy < 0 || dSanity < 0) {
    state.ledger.push({
      source,
      energy: dEnergy < 0 ? -dEnergy : 0,
      sanity: dSanity < 0 ? -dSanity : 0,
    });
  }
}

function biggestCost(ledger, key) {
  const totals = {};
  for (const row of ledger) totals[row.source] = (totals[row.source] || 0) + (row[key] || 0);
  let source = "";
  let n = 0;
  for (const [name, value] of Object.entries(totals)) {
    if (value > n) {
      source = name;
      n = value;
    }
  }
  return { source: source || "出牌", n };
}

function currentBlocker(state) {
  return firstBlocking(state) || null;
}

function blockingCount(state) {
  return state.nodes.filter((node) => blocking(state, node)).length;
}

function nodeBrief(state, node) {
  const live = blocking(state, node);
  if (node.status === "approved") return { why: "这格已经通过。", clears: "", blocking: false, text: "已通过" };
  if (node.fake || node.status === "read") return { why: "只是被写进群里，不用签。", clears: "", blocking: false, text: "不用签" };
  if (node.hidden && !node.revealed) {
    return { why: `${node.name}：要求还没公开。`, clears: "可用：去问问。", blocking: live, text: `${node.name}：要求未公开。可用：去问问。` };
  }
  if (node.boss === "audit") {
    return { why: "审计：特批次数到了，这格单独过。", clears: "可用：周末突击。特批无效。", blocking: live, text: "审计：特批盖不过。可用：周末突击。特批无效。" };
  }
  if (node.boss === "kafka" || node.form) {
    const why = node.form ? "补充材料：卡夫卡这回合没被处理，又长出来的表。" : "流程卡夫卡：这个回合不处理，下一回合再长一张表。";
    return { why, clears: "可用：周末突击 / 向上管理。", blocking: live, text: `${why}可用：周末突击 / 向上管理。` };
  }
  if (node.boss === "architect" && !state.architectUsed) {
    return { why: "影子架构师：下一张牌的效果会被按回去。", clears: "先打一张便宜的牌让他出手，或周末突击打在他身上。", blocking: live, text: "影子架构师：会打回下一张牌。先用休息或偷换概念喂他。" };
  }
  if (node.boss === "vp") {
    return { why: "VP 评审会：人不到场，这格不过。", clears: "可用：去开会。", blocking: live, text: "VP 评审会：要人到场。可用：去开会。" };
  }
  if (node.boss === "schrodinger" || node.real) {
    const hiddenOwner = !state.schrodingerRevealed;
    if (hiddenOwner) {
      return {
        why: "安全组：真负责人藏在两三个名字里。",
        clears: "可用：拉通对齐 / 去问问。和卡夫卡对峙时特批无效。",
        blocking: live,
        text: "安全组：要行为日志。可用：拉通对齐 / 偷换概念。特批无效。",
      };
    }
    return {
      why: "安全组：要行为日志。合规不让记。",
      clears: "可用：拉通对齐 / 周末突击。没偷换概念时特批无效。",
      blocking: live,
      text: "安全组：要行为日志。可用：拉通对齐 / 偷换概念。特批无效。",
    };
  }
  const why = `${node.name}：还没签字。${node.line || ""}`.trim();
  return { why, clears: "可用：周末突击 / 向上管理。两个以上时拉通对齐能并掉一个。", blocking: live, text: `${node.name}：等人签字。可用：周末突击 / 向上管理。` };
}

function cardView(state, actionId) {
  const card = CARDS.find((item) => item.id === actionId);
  const reason = blockReason(state, actionId);
  const target = currentBlocker(state);
  let effect = card ? card.detail : "";
  if (actionId === "weekend" && target) effect = `通过当前节点：${target.name}`;
  if (actionId === "cc" && target && target.boss !== "audit") effect = `通过当前节点：${target.name}`;
  if (actionId === "hotfix") effect = "跳过普通签字 · 老板和审计不过 · 审计风险 +1";
  if (actionId === "rest") effect = `精力 +${REST_ENERGY} · 理智 +${REST_SANITY} · 不签字`;
  if (actionId === "talk") effect = "问出隐藏要求或人情 +1 · 多一个签字";
  if (actionId === "align") effect = "指出真负责人，或并掉一个节点";
  if (actionId === "reframe") effect = "标题改成体验优化 · 解开特批";
  if (state && state.nodes.some((node) => node.boss === "architect" && node.status !== "approved" && !state.architectUsed) && actionId !== "rest") {
    effect += " · 架构师可能按回效果";
  }
  const bits = [];
  if (card && actionId === "rest") {
    bits.push(`精力 +${REST_ENERGY}`, `理智 +${REST_SANITY}`, "天数 -1");
  } else if (card) {
    if (card.energy) bits.push(`精力 -${card.energy}`);
    if (card.favor) bits.push(`人情 -${card.favor}`);
    if (card.sanity) bits.push(`理智 -${card.sanity}`);
    bits.push("天数 -1");
  }
  const preview = state ? {
    energy: state.energy,
    sanity: state.sanity,
    favor: state.favor,
    days: state.days,
    audit: state.audit,
  } : null;
  if (preview && card && !reason) {
    if (actionId === "rest") {
      preview.energy = Math.min(state.energyMax, state.energy + REST_ENERGY);
      preview.sanity = Math.min(state.sanityMax, state.sanity + REST_SANITY);
      preview.days = state.days - 1;
    } else {
      preview.energy = state.energy - card.energy;
      preview.favor = state.favor - card.favor;
      preview.sanity = state.sanity - card.sanity;
      preview.days = state.days - 1;
      if (actionId === "hotfix") preview.audit = state.audit + 1;
      if (actionId === "talk") {
        const hidden = state.nodes.some((node) => node.hidden && !node.revealed);
        const owner = !state.schrodingerRevealed && state.nodes.some((node) => node.real);
        if (!hidden && !owner) preview.favor += 1;
      }
    }
  }
  return {
    id: actionId,
    name: card ? card.name : actionId,
    cost: bits.join(" · "),
    effect,
    reason,
    playable: !reason,
    preview,
  };
}

function outcomeReport(state) {
  const id = state.outcome?.id;
  const left = blockingCount(state);
  const energySpend = biggestCost(state.ledger, "energy");
  const sanitySpend = biggestCost(state.ledger, "sanity");
  const where = `第 ${state.levelId} 关还剩 ${left} 个节点`;
  if (id === "quit") {
    return {
      title: "精力归零",
      cause: `精力归零：${where}，最大消耗来自${energySpend.source} -${energySpend.n}。`,
      tip: "少打高耗的牌。过关会回一点精力，手牌里的休息也能补。",
    };
  }
  if (id === "miss") {
    return {
      title: "没有下一班了",
      cause: `窗口用尽：${where}。${state.maxTrains} 班都准点开走了。`,
      tip: "先打当前亮着的卡点。去问问会多一个签字，别把天数耗光。",
    };
  }
  if (id === "deadlock") {
    return {
      title: "合规死锁",
      cause: `强行合入失败：安全要日志，合规不让记。${where}，审批被打回。`,
      tip: "对峙时出合规报告会进虚无结局。想继续就先偷换概念。",
    };
  }
  if (id === "absurd") {
    return {
      title: "荒诞胜利",
      cause: `荒诞胜利：第 ${state.levelId} 关合进去了。业务早就砍了这个按钮。精力还剩 ${state.energy}。`,
      tip: "封网期真合进去，也会当天被撤。这就是这关的结局。",
    };
  }
  if (id === "corrupt") {
    return {
      title: "黑化结局",
      cause: `理智归零：你接下了流程负责人。最大消耗来自${sanitySpend.source} -${sanitySpend.n}。`,
      tip: "拒绝的话理智会回到至少 5，这班还能继续送。",
    };
  }
  if (id === "nihil") {
    return {
      title: "虚无结局",
      cause: `虚无结局：合规报告 100 分。第 ${state.levelId} 关一个字都没上车。`,
      tip: "这份报告会结束这一局。想上车就别选它。",
    };
  }
  return { title: "这班结束了", cause: where, tip: "看清当前卡点和每张牌的费用再出。" };
}

function randInt(state, count) {
  if (count <= 1) return 0;
  return Math.floor(nextRand(state) * count);
}

function nextRand(state) {
  let s = (state.rngS + 0x6D2B79F5) >>> 0;
  state.rngS = s;
  let t = s;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function tone(freq, dur = 0.06, type = "square", vol = 0.045) {
  if (muted) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === "suspended") audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.value = vol;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.stop(audioCtx.currentTime + dur);
}

function fitCanvas() {
  const view = window.visualViewport;
  const vw = view?.width || window.innerWidth;
  const vh = view?.height || window.innerHeight;
  portrait = vh > vw;
  W = portrait ? 240 : 426;
  H = portrait ? 426 : 240;
  if (canvas.width !== W || canvas.height !== H) {
    canvas.width = W;
    canvas.height = H;
    ctx = canvas.getContext("2d");
  }
  ctx.imageSmoothingEnabled = false;
  const scale = Math.min(vw / W, vh / H);
  if (!Number.isFinite(scale) || scale <= 0) return;
  const integer = Math.floor(scale);
  const chosen = integer >= 1 && integer / scale >= 0.92 ? integer : scale;
  canvas.style.width = `${Math.max(1, Math.floor(W * chosen))}px`;
  canvas.style.height = `${Math.max(1, Math.floor(H * chosen))}px`;
}

function blit(x, y, rows, map, scale = 3) {
  rows.forEach((row, j) => {
    for (let i = 0; i < row.length; i += 1) {
      const color = map[row[i]];
      if (!color) continue;
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x + i * scale), Math.round(y + j * scale), scale, scale);
    }
  });
}

function useFont() {
  ctx.font = "10px PixelCN, sans-serif";
  ctx.textBaseline = "top";
}

function text(value, x, y, color = INK) {
  useFont();
  ctx.fillStyle = color;
  ctx.fillText(value, Math.round(x), Math.round(y));
}

function wrap(value, width) {
  useFont();
  const lines = [];
  let line = "";
  const limit = Math.max(10, width);
  for (const ch of String(value)) {
    if (ctx.measureText(line + ch).width > limit && line) {
      lines.push(line);
      line = ch;
    } else line += ch;
  }
  if (line) lines.push(line);
  return lines.length ? lines : [""];
}

function bar(x, y, w, h, value, max, color) {
  ctx.fillStyle = "#183028";
  ctx.fillRect(x, y, w, h);
  const ratio = max > 0 ? Math.max(0, Math.min(1, value / max)) : 0;
  ctx.fillStyle = color;
  ctx.fillRect(x, y, Math.round(w * ratio), h);
  ctx.strokeStyle = "#2a4458";
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

function hit(x, y, w, h, index, kind) {
  hits.push({ x, y, w, h, index, kind });
}

function fullscreenOn() {

function toggleFullscreen() {
  const root = document.documentElement;
  const req = root.requestFullscreen || root.webkitRequestFullscreen;
  const exit = document.exitFullscreen || document.webkitExitFullscreen;
  if (fullscreenOn()) {

}

function clampCursor() {
  const list = items();
  if (!list.length) {
    cursor = 0;
    return;
  }
  if (cursor >= list.length) cursor = list.length - 1;
  if (cursor < 0) cursor = 0;
}

function queueLines(fresh) {
  if (!state) return;
  const start = fresh ? Math.max(0, state.log.length - 2) : logSeen;
  for (let i = start; i < state.log.length; i += 1) {
    lineQueue.push(`${state.log[i].who}：${state.log[i].text}`);
  }
  logSeen = state.log.length;
  pumpSpeech();
}

function pumpSpeech() {
  if (speech && speechAt < speech.length) return;
  if (!speech && lineQueue.length) {
    speech = lineQueue.shift();
    speechAt = 0;
  }
}

function skipSpeech() {
  if (speech && speechAt < speech.length) {
    speechAt = speech.length;
    return true;
  }
  if (lineQueue.length) {
    speech = lineQueue.shift();
    speechAt = 0;
    return true;
  }
  return false;
}

function begin(changeId, levelId = 1, nextSeed = seed) {
  seed = Math.max(1, Number(nextSeed) || 1);
  state = createRun(levelId, changeId, seed);
  scene = "battle";
  cursor = 0;
  hover = -1;
  logSeen = 0;
  speech = "";
  lineQueue = [];
  nextLevel = null;
  popups = [];
  queueLines(true);
  tone(523, 0.08);
}

function markHot(key) {
  hot[key] = 28;

function commit(actionId) {
  if (!state) return;
  const before = {
    energy: state.energy,
    sanity: state.sanity,
    favor: state.favor,
    days: state.days,
    audit: state.audit,
    train: state.train,
  };
  const next = applyAction(state, actionId);
  if (next === state) {
    tone(98, 0.08);
    const view = cardView(state, actionId);
    speech = view.reason || "现在不能这么做";
    speechAt = speech.length;
    return;
  }
  state = next;
  for (const key of Object.keys(before)) {
    if (key === "train") continue;
    const delta = state[key] - before[key];
    if (!delta) continue;
    markHot(key);
    const spot = anchor[key] || { x: 40, y: 8 };
    popups.push({
      x: spot.x,
      y: spot.y,
      text: `${delta > 0 ? "+" : ""}${delta}`,
      t: 42,
      color: delta < 0 ? RED : GOLD,
    });
  }
  if (state.energy < before.energy || state.sanity < before.sanity) {
    shake = 8;
    flash = 5;
    tone(150, 0.09);
  } else tone(660, 0.05);
  if (state.train !== before.train) trainAnim = 40;
  queueLines(false);
  cursor = 0;
  hover = -1;
  if (state.outcome?.kind === "level") nextLevel = continueLevel(state);
  if (state.outcome) scene = "result";
}

function confirm() {
  const list = items();
  const item = list[cursor];
  if (scene === "help") {
    helpPage = (helpPage + 1) % HELP_PAGES.length;
    tone(440, 0.04);
    return;
  }
  if ((scene === "battle" || scene === "result") && skipSpeech()) {
    tone(330, 0.03);
    return;
  }
  if (!item) return;
  if (scene === "title") {
    if (item.id === "help") openHelp();
    else if (item.id === "full") toggleFullscreen();
    else {
      scene = "station";
      cursor = 0;
      tone(494, 0.06);
    }
    return;
  }
  if (scene === "station") {
    begin(item.id, 1, seed);
    return;
  }
  if (scene === "result") {
    if (nextLevel) {
      state = nextLevel;
      nextLevel = null;
      scene = "battle";
      cursor = 0;
      hover = -1;
      logSeen = 0;
      speech = "";
      lineQueue = [];
      queueLines(true);
      tone(587, 0.08);
    } else {
      state = null;
      scene = "title";
      cursor = 0;
      hover = -1;
      speech = "";
      tone(220, 0.06);
    }
    return;
  }
  if (item.playable === false) {
    tone(98, 0.08);
    speech = item.reason || "现在不能这么做";
    speechAt = speech.length;
    return;
  }
  commit(item.id);
}

function openHelp() {
  if (scene !== "help") backScene = scene;
  scene = "help";
  helpPage = 0;
  tone(392, 0.05);
}

function back() {
  if (scene === "help") {
    scene = backScene || "title";
    tone(196, 0.05);
    return;
  }
  if (speech || lineQueue.length) {
    speech = "";
    speechAt = 0;
    lineQueue = [];
    return;
  }
  if (scene === "station" || scene === "result") {
    state = null;
    nextLevel = null;
    scene = "title";
    cursor = 0;
    hover = -1;
  }
}

function move(dx, dy) {
  if (scene === "title" && dx) {
    seed = Math.max(1, seed + dx);
    tone(300, 0.03);
    return;
  }
  if (scene === "help") {
    const step = dy || dx;
    if (!step) return;
    helpPage = Math.max(0, Math.min(HELP_PAGES.length - 1, helpPage + step));
    tone(240, 0.02, "square", 0.03);
    return;
  }
  const list = items();
  if (!list.length) return;
  const step = dx || dy;
  if (!step) return;
  cursor = (cursor + step + list.length * 4) % list.length;
  tone(240, 0.02, "square", 0.03);
}

function press(key) {
  if (key === "up") move(0, -1);
  else if (key === "down") move(0, 1);
  else if (key === "left") move(-1, 0);
  else if (key === "right") move(1, 0);
  else if (key === "a") confirm();
  else if (key === "b") back();
  else if (key === "start" || key === "p") {
    if (scene === "help") back();
    else openHelp();
  } else if (key === "select" || key === "m") {
    muted = !muted;
    if (!muted) tone(880, 0.05);
  } else if (key === "f") toggleFullscreen();
}

const KEYS = {
  ArrowUp: "up",
  ArrowDown: "down",
  ArrowLeft: "left",
  ArrowRight: "right",
  Enter: "a",
  z: "a",
  Z: "a",
  x: "b",
  X: "b",
  p: "p",
  P: "p",
  m: "m",
  M: "m",
  f: "f",
  F: "f",
  s: "start",
  S: "start",
};
window.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    event.preventDefault();
    if (scene === "help" || scene === "station" || scene === "result" || speech || lineQueue.length) back();
    else openHelp();
    return;
  }
  const key = KEYS[event.key];
  if (!key) return;
  event.preventDefault();
  press(key);
});

function pointOf(event) {
  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return null;
  return {
    x: ((event.clientX - rect.left) / rect.width) * canvas.width,
    y: ((event.clientY - rect.top) / rect.height) * canvas.height,
  };
}

function hitAt(p) {
  for (let i = hits.length - 1; i >= 0; i -= 1) {
    const box = hits[i];
    if (p.x >= box.x && p.y >= box.y && p.x < box.x + box.w && p.y < box.y + box.h) return box;
  }
  return null;
}

canvas.addEventListener("pointerdown", (event) => {
  if (event.button !== 0) return;
  canvas.focus();
  const p = pointOf(event);
  if (!p) return;
  const box = hitAt(p);
  if (!box) return;
  if (box.kind === "seed") {
    seed = Math.max(1, seed + box.index);
    tone(300, 0.03);
    return;
  }
  if (box.kind === "full") {
    toggleFullscreen();
    return;
  }
  if (box.kind === "back") {
    back();
    return;
  }
  if (box.kind === "mute") {
    press("m");
    return;
  }
  if (box.kind === "helpkey") {
    press("p");
    return;
  }
  if (box.kind === "confirmkey") {
    confirm();
    return;
  }
  if (box.kind === "speech") {
    if (skipSpeech()) tone(330, 0.03);
    return;
  }
  if (box.kind === "helppage") {
    confirm();
    return;
  }
  const touch = event.pointerType === "touch";
  if (touch && cursor !== box.index) {
    cursor = box.index;
    tone(240, 0.02, "square", 0.03);
    return;
  }
  cursor = box.index;
  confirm();
});
canvas.addEventListener("pointermove", (event) => {
  if (event.pointerType === "touch") return;
  const p = pointOf(event);
  if (!p) return;
  const box = hitAt(p);
  hover = box && box.kind === "item" ? box.index : -1;
});
canvas.addEventListener("pointerleave", () => {
  hover = -1;
});
window.addEventListener("resize", fitCanvas);
window.visualViewport?.addEventListener("resize", fitCanvas);
window.addEventListener("orientationchange", fitCanvas);
document.addEventListener("fullscreenchange", fitCanvas);

function panel(x, y, w, h, fill = PANEL) {
  ctx.fillStyle = fill;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = "#2a4458";
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

function focusedIndex() {
  const list = items();
  if (hover >= 0 && hover < list.length) return hover;
  return cursor;
}

function previewLine(item) {
  if (!item?.preview || !state) return "";
  const p = item.preview;
  return `打出后 精力 ${p.energy}/${state.energyMax} 理智 ${p.sanity}/${state.sanityMax} 人情 ${p.favor}/${state.favorMax} 天数 ${p.days} 审计 ${p.audit}/${state.auditMax}`;
}

function costParts(cost) {
  return String(cost || "").split(" · ").map((part) => part.trim()).filter(Boolean);
}

function pipColor(part) {
  if (part.includes("精力")) return BLUE;
  if (part.includes("理智")) return PURPLE;
  if (part.includes("人情")) return FAVOR;
  if (part.includes("天数")) return GREEN;
  return DIM;
}

function pipLabel(part) {
  return part.replace("精力", "").replace("理智", "").replace("人情", "").replace("天数", "").trim();
}

function drawPips(cost, x, y, maxW) {
  let cx = x;
  for (const part of costParts(cost)) {
    const label = pipLabel(part);
    const color = pipColor(part);
    useFont();
    const width = 8 + ctx.measureText(label).width + 4;
    if (cx + width > x + maxW) break;
    ctx.fillStyle = color;
    ctx.fillRect(cx, y + 2, 6, 6);
    text(label, cx + 8, y, color);
    cx += width;
  }
}

function cardLines(item, width) {
  if (item.playable === false && item.reason) {
    const lines = wrap(item.reason, width);
    return lines.slice(0, 2);
  }
  const full = item.effect || "";
  if (full && ctx.measureText(full).width <= width) return [full];
  const short = SHORT[item.id] || full || item.name;
  if (!short) return [];
  if (ctx.measureText(short).width <= width) return [short];
  return wrap(short, width).slice(0, 2);
}

function drawIcon(id, x, y) {
  blit(x, y, ICONS[id] || ICONS.talk, ICON_MAP, 1);
}

function hudHeight() {
  return portrait ? 64 : 38;
}

function drawHud() {

  const dayColor = state.days <= 2 ? RED : GREEN;
  if (portrait) {
    text(`第${state.levelId}关 ${state.levelName}`, 4, 2, hot.level ? GOLD : INK);
    remember("train", 156, 2);
    text(`班次 ${state.train}/${state.maxTrains}`, 150, 2, hot.train ? GOLD : INK);
    text("天数", 4, 16, hot.days ? GOLD : DIM);
    bar(28, 18, 48, 6, state.days, state.dayBudget, dayColor);

    text("审计", 124, 16, hot.audit ? GOLD : DIM);

    remember("audit", 188, 14);
    text(`${state.audit}/${state.auditMax}`, 188, 16, hot.audit ? GOLD : INK);

    rows.forEach(([label, value, max, color, key, y]) => {
      text(label, 4, y, hot[key] ? GOLD : DIM);

      remember(key, 154, y);

    });

  }
  text(`第${state.levelId}关 ${state.levelName}`, 4, 2, INK);
  remember("train", 360, 2);
  text(`班次 ${state.train}/${state.maxTrains}`, 340, 2, hot.train ? GOLD : INK);
  text("天数", 4, 16, hot.days ? GOLD : DIM);
  bar(28, 18, 70, 6, state.days, state.dayBudget, dayColor);
  remember("days", 102, 14);
  text(`${state.days}/${state.dayBudget}`, 102, 16, hot.days ? GOLD : INK);
  text("审计", 150, 16, hot.audit ? GOLD : DIM);
  bar(174, 18, 52, 6, state.audit, state.auditMax, RED);
  remember("audit", 230, 14);
  text(`${state.audit}/${state.auditMax}`, 230, 16, hot.audit ? GOLD : INK);
  const cols = [
    ["精力", state.energy, state.energyMax, BLUE, "energy", 4],
    ["理智", state.sanity, state.sanityMax, PURPLE, "sanity", 148],
    ["人情", state.favor, state.favorMax, FAVOR, "favor", 292],
  ];
  cols.forEach(([label, value, max, color, key, x]) => {
    text(label, x, 26, hot[key] ? GOLD : DIM);
    bar(x + 24, 28, 52, 6, value, max, color);
    remember(key, x + 80, 24);
    text(`${value}/${max}`, x + 80, 26, hot[key] ? GOLD : INK);
  });
  return 38;
}

function actorKind(node) {
  if (!node) return "mob";
  if (node.boss && SPRITE[node.boss]) return node.boss;
  if (node.form) return "kafka";
  return "mob";
}

function trainSlot() {
  return portrait ? 28 : 40;
}

function drawActors(region) {
  const blocker = state ? currentBlocker(state) : null;
  const scale = region.h >= 56 ? 3 : 2;
  const sh = 18 * scale;
  const sw = 16 * scale;
  const ground = region.y + region.h - 4;
  const reserved = trainSlot();
  ctx.fillStyle = "#102018";
  ctx.fillRect(0, region.y, W, region.h);
  ctx.fillStyle = "#1a2830";
  ctx.fillRect(0, ground, W, 4);
  const bob = Math.floor(frame / 10) % 2 === 0 ? 0 : -1;
  const py = ground - sh + bob;
  blit(8, py, PLAYER, MAPS.player, scale);
  const kind = actorKind(blocker);
  const enemyBob = blocker && Math.floor(frame / 8) % 2 === 0 ? -2 : 0;
  const enemyX = W - sw - reserved - 6;
  blit(enemyX, ground - sh + enemyBob, SPRITE[kind], MAPS[kind] || MAPS.mob, scale);
  const name = blocker ? blocker.name : "没有卡点";
  const gapX = 8 + sw + 4;
  const gapW = Math.max(48, enemyX - gapX - 4);
  const lines = wrap(name, gapW);
  const nameY = region.y + 2;
  text("VS", gapX + gapW / 2 - 8, nameY, RED);
  lines.slice(0, 2).forEach((line, index) => {
    const tw = ctx.measureText(line).width;
    text(line, gapX + (gapW - tw) / 2, nameY + 12 + index * 12, GOLD);
  });
  if (state && state.days <= 2) text("即将发车", gapX + 4, ground - 14, RED);
}

function drawConflictButtons(area) {
  if (!area || !state || state.pendingChoice || !conflictOpen(state)) return;
  const list = items();
  const ids = ["nihil", "force"];
  const gap = 4;
  const bw = Math.floor((area.w - gap) / ids.length);
  let x = area.x;
  ids.forEach((id) => {
    const index = list.findIndex((item) => item.id === id);
    if (index < 0) return;
    const on = index === cursor || index === hover;
    panel(x, area.y, bw, area.h, on ? "#1c3a28" : "#0e1c28");
    if (on) {
      ctx.strokeStyle = GOLD;
      ctx.strokeRect(x + 1.5, area.y + 1.5, bw - 3, area.h - 3);
    }
    hit(x, area.y, bw, area.h, index, "item");
    text(list[index].name, x + 6, area.y + Math.max(2, Math.round((area.h - 10) / 2)), on ? GOLD : INK);
    x += bw + gap;
  });
}

function drawRail(y) {
  const blocker = currentBlocker(state);
  const nodes = state.nodes.filter((node) => node.status !== "read" || node.boss);
  ctx.fillStyle = "#4a4030";
  ctx.fillRect(8, y + 8, W - 56, 3);
  const span = Math.max(20, W - 70);
  const step = nodes.length ? span / nodes.length : 28;
  nodes.forEach((node, index) => {
    const x = 12 + index * step;
    const current = blocker && node.id === blocker.id;
    const bob = current && Math.floor(frame / 8) % 2 === 0 ? -2 : 0;
    const size = current ? 10 : 7;
    ctx.fillStyle = node.status === "approved" ? GREEN : current ? RED : "#d8efe0";
    ctx.fillRect(x, y + 4 + bob, size, size);
    if (node.boss || node.form) {
      ctx.fillStyle = GOLD;
      ctx.fillRect(x + 2, y + 6 + bob, 3, 3);
    }
  });
  const shift = state.days <= 2 ? 4 + Math.sin(frame / 4) * 2 : 0;
  const tx = W - trainSlot() - shift - (trainAnim ? Math.sin(frame / 2) * 2 : 0);
  blit(tx, y - 4, TRAIN, MAPS.train, portrait ? 1 : 2);
}

function drawWhy(y, height) {
  const blocker = currentBlocker(state);
  const brief = blocker ? nodeBrief(state, blocker).text : "当前没有卡住的格子。";
  const lines = wrap(brief, W - 12);
  const max = Math.max(1, Math.floor(height / 12));
  lines.slice(0, max).forEach((line, index) => {
    text(line, 6, y + index * 12, blocker ? GOLD : DIM);
  });
}

function detailLines(item, width) {
  if (!item) return [];
  const lines = [];
  if (item.playable === false && item.reason) {
    wrap(item.reason, width).forEach((t) => lines.push({ t, c: RED }));
  }
  if (item.effect) wrap(item.effect, width).forEach((t) => lines.push({ t, c: INK }));
  if (item.cost) wrap(`费用 ${item.cost}`, width).forEach((t) => lines.push({ t, c: DIM }));
  if (item.playable !== false && item.preview) {
    wrap(previewLine(item), width).forEach((t) => lines.push({ t, c: GOLD }));
  }
  return lines;
}

function drawSpeech(box) {
  panel(box.x, box.y, box.w, box.h, "#0e1c28");
  hit(box.x, box.y, box.w, box.h, 0, "speech");
  const typing = speech && speechAt < speech.length;
  const list = items();
  const item = list[focusedIndex()];
  const showDetail = !typing && item && (item.effect || item.reason || item.preview);
  let lines = [];
  if (showDetail && (hover >= 0 || cursor >= 0)) {
    lines = detailLines(item, box.w - 12);
  } else if (speech) {
    lines = wrap(speech.slice(0, speechAt), box.w - 12).map((t) => ({ t, c: INK }));
  } else if (state?.turns?.length) {
    const turn = state.turns[state.turns.length - 1];
    lines = wrap(`${turn.source} ${turn.text}`, box.w - 12).map((t) => ({ t, c: DIM }));
  }
  const max = Math.max(1, Math.floor((box.h - 6) / 12));
  lines.slice(0, max).forEach((line, index) => text(line.t, box.x + 6, box.y + 4 + index * 12, line.c));
}

function drawIconCard(item, index, x, y, w, h) {
  const on = index === cursor;
  const over = index === hover;
  const fill = item.playable === false ? "#161c1a" : on ? "#1c3a28" : "#102030";
  panel(x, y, w, h, fill);
  if (on || over) {
    ctx.strokeStyle = GOLD;
    ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
  }
  hit(x, y, w, h, index, "item");
  ctx.save();
  ctx.beginPath();
  ctx.rect(x + 2, y + 2, w - 4, h - 4);
  ctx.clip();
  drawIcon(item.id, x + 4, y + 4);
  const nameColor = item.playable === false ? "#5d6b64" : on ? GOLD : INK;
  text(item.name, x + 16, y + 3, nameColor);
  drawPips(item.cost, x + 4, y + 16, w - 8);
  const lines = cardLines(item, w - 8);
  const color = item.playable === false ? RED : DIM;
  lines.forEach((line, lineIndex) => {
    const ly = y + 28 + lineIndex * 12;
    if (ly < y + h - 10) text(line, x + 4, ly, color);
  });
  ctx.restore();
}

function drawRowCard(item, index, x, y, w, h) {
  const on = index === cursor;
  const over = index === hover;
  const fill = item.playable === false ? "#161c1a" : on ? "#1c3a28" : "#102030";
  panel(x, y, w, h, fill);
  if (on || over) {
    ctx.strokeStyle = GOLD;
    ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
  }
  hit(x, y, w, h, index, "item");
  drawIcon(item.id, x + 4, y + 4);
  const nameColor = item.playable === false ? "#5d6b64" : on ? GOLD : INK;
  text(item.name, x + 16, y + 3, nameColor);
  const lines = cardLines(item, w - 20);
  const color = item.playable === false ? RED : DIM;
  if (lines[0]) text(lines[0], x + 16, y + 16, color);
  if (h >= 40 && lines[1]) text(lines[1], x + 16, y + 28, color);
  useFont();
  const pipW = Math.min(120, w / 2);
  drawPips(item.cost, x + w - pipW - 4, y + 3, pipW);
}

function drawHand(area, list) {
  const main = list.filter((item) => item.id !== "nihil" && item.id !== "force");
  if (portrait || main.length > 4) {
    const rowH = Math.floor(area.h / Math.max(1, main.length));
    main.forEach((item) => {
      const index = list.indexOf(item);
      drawRowCard(item, index, area.x, area.y + index * rowH, area.w, Math.max(16, rowH - 3));
    });
    return;
  }
  const gap = 4;
  const cw = Math.floor((area.w - gap * (main.length - 1)) / Math.max(1, main.length));
  main.forEach((item) => {
    const index = list.indexOf(item);
    drawIconCard(item, index, area.x + index * (cw + gap), area.y, cw, area.h);
  });
}

function drawChoiceList(area, list) {
  const rowH = Math.floor(area.h / Math.max(1, list.length));
  list.forEach((item, index) => {
    const y = area.y + index * rowH;
    const h = Math.max(16, rowH - 3);
    const on = index === cursor || index === hover;
    const fill = item.playable === false ? "#161c1a" : on ? "#1c3a28" : "#102030";
    panel(area.x, y, area.w, h, fill);
    if (on) {
      ctx.strokeStyle = GOLD;
      ctx.strokeRect(area.x + 1.5, y + 1.5, area.w - 3, h - 3);
    }
    hit(area.x, y, area.w, h, index, "item");
    const nameColor = item.playable === false ? "#5d6b64" : on ? GOLD : INK;
    text(item.name, area.x + 6, y + 3, nameColor);
    const body = item.playable === false ? item.reason : [item.cost, item.effect].filter(Boolean).join(" · ");
    if (body) {
      const lines = wrap(body, area.w - 12);
      text(lines[0], area.x + 6, y + 16, item.playable === false ? RED : DIM);
      if (h >= 40 && lines[1]) text(lines[1], area.x + 6, y + 28, item.playable === false ? RED : DIM);
    }
  });
}

function battleLayout() {
  const hint = 14;
  const hud = hudHeight();
  const pending = !!state?.pendingChoice;
  const conflict = !!(state && !pending && conflictOpen(state));
  if (portrait) {
    const actorH = 78;
    const railH = 16;
    const whyH = 24;
    const speechH = pending ? 36 : 48;
    const conflictH = conflict ? 18 : 0;
    const actorY = hud;
    const railY = actorY + actorH;
    const whyY = railY + railH;
    const speechY = whyY + whyH;
    const conflictY = speechY + speechH;
    const menuY = conflictY + conflictH;
    return {
      actor: { y: actorY, h: actorH },
      railY,
      why: { y: whyY, h: whyH },
      speech: { x: 4, y: speechY, w: W - 8, h: speechH },
      conflict: conflict ? { x: 4, y: conflictY, w: W - 8, h: conflictH } : null,
      menu: { x: 4, y: menuY, w: W - 8, h: H - hint - menuY },
      pending,
    };
  }
  const menuH = pending ? 70 : 52;
  const speechH = 36;
  const whyH = 24;
  const railH = 16;
  const menuY = H - hint - menuH;
  const speechY = menuY - speechH;
  const whyY = speechY - whyH;
  const railY = whyY - railH;
  return {
    actor: { y: hud, h: Math.max(36, railY - hud) },
    railY,
    why: { y: whyY, h: whyH },
    speech: { x: 4, y: speechY, w: W - 8, h: speechH },
    conflict: null,
    menu: { x: 4, y: menuY, w: W - 8, h: menuH },
    pending,
  };
}

function drawBattle() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  drawHud();
  const layout = battleLayout();
  drawActors(layout.actor);
  if (layout.conflict) drawConflictButtons(layout.conflict);
  else if (!portrait && state && !state.pendingChoice && conflictOpen(state)) {
    const width = 164;
    const x = Math.max(8, Math.round((W - trainSlot()) / 2 - width / 2));
    drawConflictButtons({ x, y: layout.actor.y + layout.actor.h - 22, w: width, h: 16 });
  }
  drawRail(layout.railY);
  drawWhy(layout.why.y, layout.why.h);
  drawSpeech(layout.speech);
  const list = items();
  if (layout.pending) drawChoiceList(layout.menu, list);
  else drawHand(layout.menu, list);
}

function drawTitle() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#102018";
  ctx.fillRect(0, portrait ? 150 : 150, W, portrait ? 40 : 28);
  ctx.fillStyle = "#4a4030";
  ctx.fillRect(0, portrait ? 188 : 176, W, 3);
  const trainScale = portrait ? 4 : 5;
  blit(portrait ? 48 : 18, portrait ? 78 : 86, TRAIN, MAPS.train, trainScale);
  const tx = portrait ? 16 : 168;
  text("下一班火车", tx, portrait ? 36 : 28, GOLD);
  text("把一行改动送上版本火车", tx, portrait ? 52 : 44, INK);
  text("初级工程师的审批战", tx, portrait ? 68 : 60, DIM);
  const seedY = portrait ? 210 : 92;
  text("种子", tx, seedY, DIM);
  const seedLabel = `${seed}`;
  text(seedLabel, tx + 28, seedY, INK);
  panel(tx + 64, seedY - 2, 16, 14, "#102030");
  text("<", tx + 68, seedY, GOLD);
  hit(tx + 64, seedY - 2, 16, 14, -1, "seed");
  panel(tx + 84, seedY - 2, 16, 14, "#102030");
  text(">", tx + 88, seedY, GOLD);
  hit(tx + 84, seedY - 2, 16, 14, 1, "seed");
  const list = items();
  const my = portrait ? 250 : 124;
  list.forEach((item, index) => {
    const y = my + index * 28;
    const on = index === cursor || index === hover;
    panel(tx, y, portrait ? 208 : 220, 24, on ? "#1c3a28" : "#102030");
    if (on) {
      ctx.strokeStyle = GOLD;
      ctx.strokeRect(tx + 1.5, y + 1.5, (portrait ? 208 : 220) - 3, 21);
    }
    hit(tx, y, portrait ? 208 : 220, 24, index, "item");
    text(item.name, tx + 8, y + 6, on ? GOLD : INK);
  });
}

function drawStation() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  text("车站", 8, 4, GOLD);
  panel(W - 52, 4, 44, 16, "#102030");
  text("返回", W - 44, 6, DIM);
  hit(W - 52, 4, 44, 16, 0, "back");
  text("选一行改动。三种开头不一样。", 8, 20, INK);
  text(`种子 ${seed}`, portrait ? 8 : 250, portrait ? 34 : 4, DIM);
  const list = items();
  const top = portrait ? 48 : 36;
  const gap = 4;
  if (portrait) {
    const ch = Math.floor((H - 14 - top - gap * 2) / 3);
    list.forEach((item, index) => {
      const y = top + index * (ch + gap);
      drawChangeCard(item, index, 4, y, W - 8, ch - 2);
    });
    return;
  }
  const cw = Math.floor((W - 8 - gap * 2) / 3);
  list.forEach((item, index) => {
    drawChangeCard(item, index, 4 + index * (cw + gap), top, cw, H - 14 - top - 4);
  });
}

function drawChangeCard(item, index, x, y, w, h) {
  const on = index === cursor || index === hover;
  panel(x, y, w, h, on ? "#1c3a28" : "#102030");
  if (on) {
    ctx.strokeStyle = GOLD;
    ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
  }
  hit(x, y, w, h, index, "item");
  text(item.name, x + 6, y + 6, on ? GOLD : INK);
  let lineY = y + 22;
  wrap(item.effect || "", w - 12).forEach((line) => {
    if (lineY > y + h - 14) return;
    text(line, x + 6, lineY, INK);
    lineY += 12;
  });
  lineY += 4;
  String(item.diff || "").split("\n").forEach((line) => {
    if (lineY > y + h - 14) return;
    text(line, x + 6, lineY, line.startsWith("+") ? GREEN : DIM);
    lineY += 12;
  });
}

function drawHelp() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  text("玩法说明", 8, 6, GOLD);
  text(`${helpPage + 1}/${HELP_PAGES.length}`, W - 36, 6, DIM);
  hit(8, 22, W - 16, H - 64, 0, "helppage");
  let y = 24;
  const lines = HELP_PAGES[helpPage].flatMap((line) => wrap(line, W - 16));
  for (const line of lines) {
    if (y > H - 48) break;
    text(line, 8, y, INK);
    y += 14;
  }
  const by = H - 32;
  panel(8, by, 72, 16, "#102030");
  text("返回", 28, by + 3, INK);
  hit(8, by, 72, 16, 0, "back");
  panel(88, by, 96, 16, "#102030");
  text(fullscreenLabel(), 100, by + 3, GOLD);
  hit(88, by, 96, 16, 0, "full");
}

function drawResult() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  const hud = drawHud();
  const report = state.outcome?.kind === "level"
    ? {
      title: "这关过了",
      cause: `下一关是${nextLevel?.levelName || "下一关"}。精力 ${nextLevel?.energy}/${nextLevel?.energyMax}，理智 ${nextLevel?.sanity}/${nextLevel?.sanityMax}，人情 ${nextLevel?.favor}/${nextLevel?.favorMax}。`,
      tip: "过关会补一点精力、理智和人情。",
    }
    : outcomeReport(state);
  let y = hud + 8;
  text(report.title, 8, y, GOLD);
  y += 16;
  for (const line of wrap(report.cause, W - 16)) {
    text(line, 8, y, INK);
    y += 12;
  }
  y += 6;
  for (const line of wrap(`提示：${report.tip}`, W - 16)) {
    text(line, 8, y, DIM);
    y += 12;
  }
  if (speech) {
    y += 4;
    wrap(speech.slice(0, speechAt), W - 16).slice(0, 3).forEach((line) => {
      text(line, 8, y, "#9ad0c8");
      y += 12;
    });
  }
  y += 8;
  const list = items();
  const item = list[0];
  if (!item) return;
  const bw = Math.min(180, W - 16);
  panel(8, y, bw, 22, cursor === 0 || hover === 0 ? "#1c3a28" : "#102030");
  text(item.name, 16, y + 6, GOLD);
  hit(8, y, bw, 22, 0, "item");
}

function drawHint() {
  const y = H - 13;
  ctx.fillStyle = "#05070a";
  ctx.fillRect(0, y - 1, W, 14);
  const bits = [
    { t: "方向", kind: "" },
    { t: "确认Z", kind: "confirmkey" },
    { t: "返回X", kind: "back" },
    { t: "说明P", kind: "helpkey" },
    { t: muted ? "有声M" : "静音M", kind: "mute" },
  ];
  let x = 4;
  for (const bit of bits) {
    useFont();
    const w = ctx.measureText(bit.t).width + 8;
    const color = bit.kind === "mute" && muted ? RED : DIM;
    text(bit.t, x, y, color);
    if (bit.kind) hit(x - 2, y - 2, w, 14, 0, bit.kind);
    x += w;
    if (x > W - 8) break;
  }
}

function drawPopups() {
  for (const popup of popups) {
    text(popup.text, popup.x, popup.y - (42 - popup.t) / 3, popup.color);
  }
}

function frameTick() {
  fitCanvas();
  hits.length = 0;
  frame += 1;
  if (speech && speechAt < speech.length && frame % 2 === 0) {
    speechAt += 1;
    if (speechAt % 3 === 0) tone(520, 0.015, "square", 0.02);
  }
  pumpSpeech();
  popups = popups.filter((popup) => {
    popup.t -= 1;
    return popup.t > 0;
  });
  for (const key of Object.keys(hot)) if (hot[key] > 0) hot[key] -= 1;
  if (shake > 0) shake -= 1;
  if (flash > 0) flash -= 1;
  if (trainAnim > 0) trainAnim -= 1;
  clampCursor();
  const dx = shake ? ((frame % 2) ? 2 : -2) : 0;
  ctx.save();
  ctx.translate(dx, 0);
  ctx.fillStyle = BG;
  ctx.fillRect(-4, 0, W + 8, H);
  if (scene === "title") drawTitle();
  else if (scene === "station") drawStation();
  else if (scene === "help") drawHelp();
  else if (scene === "result") drawResult();
  else drawBattle();
  drawPopups();
  drawHint();
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,244,224,${flash / 12})`;
    ctx.fillRect(-4, 0, W + 8, H);
  }
  if (!fontReady) text("……", 8, 8, DIM);
  ctx.restore();
  requestAnimationFrame(frameTick);
}

fitCanvas();
canvas.focus();
requestAnimationFrame(frameTick);

if (debug) {
  window.__next = {
    get state() {
      return state;
    },
    get scene() {
      return scene;
    },
    begin,
    act: commit,
    press,
    legalActions: () => (state ? legalActions(state) : []),
  };
}

</script>
